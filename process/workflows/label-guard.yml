# Template to copy into <product-repo>/.github/workflows/label-guard.yml by hand — sync-github.mjs
# deliberately does not distribute workflows (see process/ci-and-branch-protection.md).
#
# Guards the state-machine invariants from process/sdlc-flow.md that the labels alone can't
# enforce. On a violation it comments on the Issue and the run goes red — it never fixes labels
# itself: which label is right is a decision, and a guard that "repairs" state hides the mistake.
#
# What it can't check: WHO removed `waiting-on-human`. Agents act on the human's own account, so
# the event actor is the human either way. That rule stays a rule until agents get their own
# technical account (see process/ci-and-branch-protection.md, §2).
#
# It also guards the scope lock (process/task-command.md, "Scope lock"): on an Issue past gate 1,
# an edit to the Definition of done, the Out of scope or the criteria — between the task's own
# checks, or on a task nobody is driving — gets a comment and a red run. It needs
# scripts/scope-check.sh on the default branch, the same script the task command uses.

name: label-guard

on:
  issues:
    types: [opened, reopened, closed, edited, labeled, unlabeled]

# Labels change in bursts (remove the old state, add the new one). Only the last event in a burst
# is checked, after a pause, so intermediate states don't produce false alarms.
concurrency:
  group: label-guard-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the scope script is needed. Pinned to a full commit SHA, not a tag: a tag can be
      # moved to different code after it was reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/scope-check.sh
          sparse-checkout-cone-mode: false

      - name: Check state-machine label invariants
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          sleep 30
          # Current state and labels from the API, not the event payload — the payload is a
          # snapshot from the moment of that one event, possibly several changes ago.
          info=$(gh issue view "$NUMBER" --repo "$REPO" --json state,labels \
            --jq '.state, (.labels[].name)')
          issue_state=$(head -n 1 <<<"$info")
          labels=$(tail -n +2 <<<"$info")

          has() { grep -qx -- "$1" <<<"$labels"; }
          states=$(grep -c '^state:' <<<"$labels" || true)
          process=$(grep -cE '^(state:|role:|waiting-on-human$)' <<<"$labels" || true)
          violations=()

          # Out of the process entirely (no process label at all) — nothing to guard.
          if [ "$process" -eq 0 ]; then echo "No process labels — skipped."; exit 0; fi

          [ "$states" -eq 1 ] || violations+=("exactly one \`state:*\` label expected, found $states")

          for gate in state:decision state:merge state:evidence; do
            if has "$gate" && ! has waiting-on-human; then
              violations+=("\`$gate\` is a human gate but \`waiting-on-human\` is missing")
            fi
          done

          if has state:closed && has evidence:missing; then
            violations+=("\`state:closed\` together with \`evidence:missing\` — status raised without evidence")
          fi

          # Only the gate-3 documentation PR closes a task. A code PR with a closing keyword, or a
          # manual close, takes the Issue out of the is:open filter while it still waits for a
          # human. The guard raises the alarm; it doesn't reopen — which state is right is a decision.
          if [ "$issue_state" = "CLOSED" ] && ! has state:closed; then
            violations+=("the Issue is closed but not in \`state:closed\` — closed before gate 3; reopen it or finish gate 3")
          fi

          echo "Labels checked: $(wc -l <<<"$labels")"
          if [ ${#violations[@]} -eq 0 ]; then echo "OK"; exit 0; fi

          body="**label-guard:** the labels break the state machine (process/sdlc-flow.md):"
          for v in "${violations[@]}"; do body+=$'\n'"- $v"; echo "VIOLATION: $v"; done
          gh issue comment "$NUMBER" --repo "$REPO" --body "$body"
          exit 1

      # Runs even when the label check went red: the two are independent findings.
      - name: Check the scope lock after gate 1
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels=$(gh issue view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if ! grep -qxE 'state:(implementation|qa|merge|evidence)' <<<"$labels"; then
            echo "Not past gate 1 — no scope lock to guard."; exit 0
          fi

          comments=$(gh issue view "$NUMBER" --repo "$REPO" --json comments --jq '.comments[].body')
          gh issue view "$NUMBER" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/body.md"
          # Exit 1 from the script is a finding (its message says which); 2 is the check failing.
          err="$RUNNER_TEMP/err"; code=0
          locked=$(bash scripts/scope-check.sh locked - 2>"$err" <<<"$comments") || code=$?
          [ "$code" -le 1 ] || { cat "$err"; exit 2; }
          if [ "$code" -eq 0 ]; then
            current=$(bash scripts/scope-check.sh hash "$RUNNER_TEMP/body.md" 2>"$err") || code=$?
            [ "$code" -le 1 ] || { cat "$err"; exit 2; }
          fi
          if [ "$code" -eq 0 ] && [ "$current" = "$locked" ]; then
            echo "Scope lock holds: $locked"; exit 0
          fi

          if [ "$code" -eq 0 ]; then
            finding="the scope changed after gate 1 — it now hashes to $current, the lock is $locked."
          else
            finding="the scope can't be compared after gate 1 — $(sed 's/^scope-check: //' "$err" | paste -sd ';' -)."
          fi
          echo "VIOLATION: $finding"
          # One comment per distinct finding, so later label events on the same Issue stay red
          # without repeating it. The text never starts with "Scope for" or "Scope amended", so
          # this comment can't count as a lock.
          if ! grep -qF -- "$finding" <<<"$comments"; then
            gh issue comment "$NUMBER" --repo "$REPO" --body "**label-guard:** $finding The Issue's edit history shows what changed. The task goes back to gate 1 (process/task-command.md, \"Scope lock\"); which version is right is the human's decision."
          fi
          exit 1
